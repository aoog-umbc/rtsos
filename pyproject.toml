[project]
name = "rtsos"
description = "Radiative Transfer model based on Successive Orders of Scattering"
authors = [
  {name = "Pengwang Zhai", email = "pwzhai@gmail.com"},
  {name = "Ian Carroll", email = "ian.t.carroll@nasa.gov"}
]
license = "CC-BY-NC-4.0"
dynamic = ["version"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "xarray>=2022.3",
    "netcdf4>=1.6.1",
    "dask>=2022.10.2",
]

[project.urls]
repository = "https://github.com/aoog-umbc/rtsos"

[project.scripts]
rt-AC-LUT = "rtsos.rt_AC_LUT:main"
rt-PACE = "rtsos.rt_PACE:main"
rt-PHMX = "rtsos.rt_PHMX:main"

[dependency-groups]
dev = [
    "pytest",
    "black",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/rtsos/_version.py"]
minimum-version = "build-system.requires"
cmake.args = ["-G", "Unix Makefiles"]

[tool.setuptools_scm]
write_to = "src/rtsos/_version.py"

[tool.pytest]
cache_dir = "test/.pytest_cache"

[build-system]
requires = ["scikit-build-core>=0.11", "numpy>=2.1"]
build-backend = "scikit_build_core.build"
