[project]
name = "zhai-rt"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.3",
    "xarray>=2022.3",
    "netcdf4>=1.6.1",
    "dask>=2022.10.2",
]

[project.scripts]
rt-AC-LUT = "zhai_rt.rt_AC_LUT:main"
rt-PACE = "zhai_rt.rt_PACE:main"
rt-PHMX = "zhai_rt.rt_PHMX:main"

[dependency-groups]
dev = [
    "pytest",
    "black",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["zhai_rt/_version.py"]
minimum-version = "build-system.requires"
cmake.args = ["-G", "Unix Makefiles"]

[tool.setuptools_scm]
write_to = "zhai_rt/_version.py"

[tool.pytest]
cache_dir = "tests/.pytest_cache"

[build-system]
requires = ["scikit-build-core>=0.11", "numpy>=2"]
build-backend = "scikit_build_core.build"
