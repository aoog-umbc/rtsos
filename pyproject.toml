[project]
name = "rtsos"
dynamic = ["version"]
license = "CC-BY-NC-4.0"
authors = [
  {name = "Pengwang Zhai", email = "pwzhai@gmail.com"},
  {name = "Ian Carroll", email = "ian.t.carroll@nasa.gov"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.3",
    "xarray>=2022.3",
    "netcdf4>=1.6.1",
    "dask>=2022.10.2",
]

[project.scripts]
rt-AC-LUT = "rtsos.rt_AC_LUT:main"
rt-PACE = "rtsos.rt_PACE:main"
rt-PHMX = "rtsos.rt_PHMX:main"

[dependency-groups]
dev = [
    "pytest",
    "black",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/rtsos/_version.py"]
minimum-version = "build-system.requires"
cmake.args = ["-G", "Unix Makefiles"]

[tool.setuptools_scm]
write_to = "src/rtsos/_version.py"

[tool.pytest]
cache_dir = "tests/.pytest_cache"

[build-system]
requires = ["scikit-build-core>=0.11", "numpy>=2"]
build-backend = "scikit_build_core.build"
